services:
  kiro-ide:
    build: .
    container_name: kiro-ide
    ports:
      - "5901:5901"   # VNC
      - "6080:6080"   # noVNC (browser)
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - VNC_RESOLUTION=1920x1080
    volumes:
      - ./workspace:/home/kiro/workspace
    shm_size: "2gb"
    security_opt:
      - seccomp=unconfined
